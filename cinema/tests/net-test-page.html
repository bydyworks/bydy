<!doctype html>
<meta charset="utf-8">
<title>net.js test page</title>
<body>
<script type="module">
  // Harness driven by test-net.mjs through page.evaluate(). `?mod=` selects the
  // URL net.js is imported from (to exercise the default mqttUrl resolution).
  const params = new URLSearchParams(location.search);
  const { createNet, DEFAULT_BROKERS, MAX_WIRE_BYTES } = await import(params.get('mod') || '/net.js');
  const nets = new Map();

  window.T = {
    DEFAULT_BROKERS: [...DEFAULT_BROKERS],
    MAX_WIRE_BYTES,
    /** Create a net called `name`; returns the status right after createNet() resolved. */
    async start(name, cfg) {
      const rec = { log: [], statusLog: [], net: null, callbacksBeforeResolve: 0, resolved: false };
      rec.net = await createNet({
        ...cfg,
        onMessage: (from, type, data, info) => {
          if (!rec.resolved) rec.callbacksBeforeResolve++;
          rec.log.push({ from, type, data, late: info.late });
        },
        onStatus: (s) => {
          if (!rec.resolved) rec.callbacksBeforeResolve++;
          rec.statusLog.push(s);
        },
      });
      rec.resolved = true;
      nets.set(name, rec);
      return rec.net.status();
    },
    /** createNet() that is expected to fail: returns the error message (or null if it resolved). */
    async startExpectingError(cfg) {
      try {
        const net = await createNet(cfg);
        await net.close();
        return null;
      } catch (err) {
        return `${err.name}: ${err.message}`;
      }
    },
    send(name, type, data) {
      nets.get(name).net.send(type, data);
    },
    /** n messages in one synchronous loop. */
    burst(name, type, n) {
      const net = nets.get(name).net;
      for (let k = 0; k < n; k++) net.send(type, { k });
    },
    /** n messages, one every `everyMs`; resolves when the last one was handed to send(). */
    stream(name, type, n, everyMs) {
      const net = nets.get(name).net;
      let k = 0;
      return new Promise((resolve) => {
        const timer = setInterval(() => {
          net.send(type, { k });
          if (++k >= n) {
            clearInterval(timer);
            resolve();
          }
        }, everyMs);
      });
    },
    sendThrows(name, type, data) {
      try {
        nets.get(name).net.send(type, data);
        return null;
      } catch (err) {
        return `${err.name}: ${err.message}`;
      }
    },
    messages(name, type) {
      return nets.get(name).log.filter((m) => type === undefined || m.type === type);
    },
    count(name, type) {
      let n = 0;
      for (const m of nets.get(name).log) if (type === undefined || m.type === type) n++;
      return n;
    },
    status(name) {
      return nets.get(name).net.status();
    },
    statusLog(name) {
      return nets.get(name).statusLog;
    },
    callbacksBeforeResolve(name) {
      return nets.get(name).callbacksBeforeResolve;
    },
    close(name) {
      return nets.get(name).net.close();
    },
    /** send, close, send again - all in the same tick. */
    byeAndClose(name) {
      const net = nets.get(name).net;
      net.send('bye', { final: true });
      const done = net.close();
      net.send('after-close', {});
      return done;
    },
  };
  window.__ready = true;
</script>
</body>
